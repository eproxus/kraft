name: Continuous Integration

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        env:
          cache-name: rebar3
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ci-${{runner.os}}-${{env.cache-name}}-${{hashFiles('mise.toml', 'rebar.lock')}}
          restore-keys: |
            ci-${{runner.os}}-${{env.cache-name}}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        env:
          cache-name: tailwind
        with:
          path: |
            priv/styles/node_modules
          key: ci-${{runner.os}}-${{env.cache-name}}-${{hashFiles('priv/styles/yarn.lock')}}

      - name: Verify
        run: mise run --output=keep-order verify

      - name: Test
        run: mise run --output=keep-order test
